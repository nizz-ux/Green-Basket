<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Screen Chat Box</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .chat-container {
      position: fixed;
      top: 10%;
      left: 20%;
      width: 60%;
      height: 60%;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .chat-header {
      background: #007bff;
      color: #fff;
      padding: 20px;
      font-size: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header .close-btn {
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fafafa;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
    }

    .message.sent {
      justify-content: flex-end;
    }

    .message.received {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 20px;
      font-size: 16px;
      line-height: 1.4;
    }

    .message.sent .bubble {
      background: #007bff;
      color: #fff;
      border-bottom-right-radius: 0;
    }

    .message.received .bubble {
      background: #e9ecef;
      color: #333;
      border-bottom-left-radius: 0;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 15px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    .chat-input button {
      padding: 0 20px;
      border: none;
      background: #007bff;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
    }

    .chat-input button:hover {
      background: #0069d9;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div>GREEN BASKET </div>
      <div class="close-btn" onclick="toggleChat()">×</div>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="message received">
        <div class="bubble">WelCome Green Basket, how can I help you today?</div>
      </div>
      {% if user_input %}
      <div class="message sent">
        <div class="bubble">{{ user_input }}</div>
      </div>
      <div class="message received">
        <div class="bubble">{{ response }}</div>
      </div>
      {% endif %}
    </div>
    <form class="chat-input" method="post">
      {% csrf_token %}
      <input type="text" name="user_input" placeholder="Type your message..."  autocomplete="true"  required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    function toggleChat(){
      const chatContainer = document.querySelector('.chat-container');
      chatContainer.style.display = (chatContainer.style.display === 'none') ? 'flex' : 'none';
    }
  </script>
</body>
</html>
